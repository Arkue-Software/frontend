name: CI/CD Pipeline - Self-Hosted QA

on:
  push:
    branches:
      - 'release/**'

jobs:
  build-and-deploy:
    runs-on: self-hosted 

    steps:
      # 1. Descargar el código fuente
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instalar dependencias y compilar el proyecto
      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      # 4. Copiar los archivos compilados al directorio del servidor web
      - name: Copy build to web root
        run: |
          sudo rm -rf /var/www/html/*
          sudo cp -r dist/* /var/www/html/

      # 5. Reiniciar el servidor web
      - name: Restart Nginx
        run: |
          sudo systemctl restart nginx
